name: brandymanager

services:
  db:
    image: postgres:16-alpine
    container_name: brandymanager_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brandymanager}
      POSTGRES_USER: ${POSTGRES_USER:-brandymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandymanager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back_django:
    build:
      context: ./back_django
    container_name: brandymanager_django
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-local-development-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-BrandyManager <no-reply@brandymanager.local>}"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      BM_REFRESH_COOKIE_NAME: ${BM_REFRESH_COOKIE_NAME:-bm_refresh}
      BM_REFRESH_COOKIE_SECURE: ${BM_REFRESH_COOKIE_SECURE:-False}
      BM_REFRESH_COOKIE_SAMESITE: ${BM_REFRESH_COOKIE_SAMESITE:-Lax}
      BM_REFRESH_COOKIE_PATH: ${BM_REFRESH_COOKIE_PATH:-/api/users/}
      POSTGRES_DB: ${POSTGRES_DB:-brandymanager}
      POSTGRES_USER: ${POSTGRES_USER:-brandymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandymanager}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./back_django/backend:/app
    depends_on:
      db:
        condition: service_healthy

  back_go:
    build:
      context: ./back_go
    container_name: brandymanager_go
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: ${GO_PORT:-8080}
      DJANGO_API_BASE_URL: ${DJANGO_API_BASE_URL:-http://back_django:8000}
      AUTH_MODE: ${GO_AUTH_MODE:-passthrough}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
    ports:
      - "${GO_PORT:-8080}:${GO_PORT:-8080}"
    depends_on:
      - back_django

  front_react:
    build:
      context: ../BrandyManager_Front
    container_name: brandymanager_front
    command: bun run dev --host 0.0.0.0 --port 5173
    environment:
      VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL:-http://localhost:8000}
      VITE_GO_API_URL: ${VITE_GO_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../BrandyManager_Front:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - back_django
      - back_go

  db_admin:
    image: adminer:4
    container_name: brandymanager_db_admin
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${DB_ADMIN_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  front_node_modules:
