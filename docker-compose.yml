name: brandymanager

services:
  db:
    image: postgres:16-alpine
    container_name: brandymanager_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brandymanager}
      POSTGRES_USER: ${POSTGRES_USER:-brandymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandymanager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back_django:
    build:
      context: ./back_django
    container_name: brandymanager_django
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-local-development-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-BrandyManager <no-reply@brandymanager.local>}"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      BM_REFRESH_COOKIE_NAME: ${BM_REFRESH_COOKIE_NAME:-bm_refresh}
      BM_REFRESH_COOKIE_SECURE: ${BM_REFRESH_COOKIE_SECURE:-False}
      BM_REFRESH_COOKIE_SAMESITE: ${BM_REFRESH_COOKIE_SAMESITE:-Lax}
      BM_REFRESH_COOKIE_PATH: ${BM_REFRESH_COOKIE_PATH:-/api/users/}
      BM_DEVICE_REFRESH_COOKIE_NAME: ${BM_DEVICE_REFRESH_COOKIE_NAME:-bm_device_refresh}
      BM_DEVICE_REFRESH_COOKIE_SECURE: ${BM_DEVICE_REFRESH_COOKIE_SECURE:-False}
      BM_DEVICE_REFRESH_COOKIE_SAMESITE: ${BM_DEVICE_REFRESH_COOKIE_SAMESITE:-Lax}
      BM_DEVICE_REFRESH_COOKIE_PATH: ${BM_DEVICE_REFRESH_COOKIE_PATH:-/api/player/}
      BM_DEVICE_ACCESS_TOKEN_MINUTES: ${BM_DEVICE_ACCESS_TOKEN_MINUTES:-5}
      BM_DEVICE_REFRESH_TOKEN_DAYS: ${BM_DEVICE_REFRESH_TOKEN_DAYS:-7}
      BM_DEVICE_ACTIVATION_CODE_TTL_MINUTES: ${BM_DEVICE_ACTIVATION_CODE_TTL_MINUTES:-15}
      BM_DEVICE_ACTIVATION_MAX_ATTEMPTS: ${BM_DEVICE_ACTIVATION_MAX_ATTEMPTS:-5}
      BM_DEVICE_ACTIVATION_RATE_LIMIT_ATTEMPTS: ${BM_DEVICE_ACTIVATION_RATE_LIMIT_ATTEMPTS:-10}
      BM_DEVICE_ACTIVATION_RATE_LIMIT_WINDOW_SECONDS: ${BM_DEVICE_ACTIVATION_RATE_LIMIT_WINDOW_SECONDS:-300}
      BM_DEVICE_JWT_ISSUER: ${BM_DEVICE_JWT_ISSUER:-brandymanager-django}
      BM_DEVICE_JWT_AUDIENCE: ${BM_DEVICE_JWT_AUDIENCE:-brandymanager-device}
      BM_GO_SERVICE_TOKEN: ${BM_GO_SERVICE_TOKEN:-change-me-local-service-token}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      DJANGO_DEFAULT_STORAGE_BACKEND: ${DJANGO_DEFAULT_STORAGE_BACKEND:-django.core.files.storage.FileSystemStorage}
      BM_AUDIO_STORAGE_ALIAS: ${BM_AUDIO_STORAGE_ALIAS:-default}
      BM_AUDIO_MAX_UPLOAD_BYTES: ${BM_AUDIO_MAX_UPLOAD_BYTES:-104857600}
      BM_AUDIO_CACHE_MAX_SECONDS: ${BM_AUDIO_CACHE_MAX_SECONDS:-3600}
      BM_CONTENT_MANIFEST_TTL_SECONDS: ${BM_CONTENT_MANIFEST_TTL_SECONDS:-3600}
      BM_DEVICE_HEARTBEAT_INTERVAL_SECONDS: ${BM_DEVICE_HEARTBEAT_INTERVAL_SECONDS:-30}
      BM_DEVICE_OFFLINE_THRESHOLD_SECONDS: ${BM_DEVICE_OFFLINE_THRESHOLD_SECONDS:-90}
      BM_PLAYER_TELEMETRY_RATE_LIMIT: ${BM_PLAYER_TELEMETRY_RATE_LIMIT:-120}
      BM_PLAYER_TELEMETRY_MAX_AGE_SECONDS: ${BM_PLAYER_TELEMETRY_MAX_AGE_SECONDS:-86400}
      BM_PLAYER_TELEMETRY_FUTURE_SKEW_SECONDS: ${BM_PLAYER_TELEMETRY_FUTURE_SKEW_SECONDS:-300}
      BM_PLAYER_COMMAND_BATCH_SIZE: ${BM_PLAYER_COMMAND_BATCH_SIZE:-50}
      POSTGRES_DB: ${POSTGRES_DB:-brandymanager}
      POSTGRES_USER: ${POSTGRES_USER:-brandymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandymanager}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./back_django/backend:/app
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    container_name: brandymanager_mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  back_go:
    build:
      context: ./back_go
    container_name: brandymanager_go
    environment:
      APP_ENV: ${APP_ENV:-local}
      PORT: ${GO_PORT:-8080}
      DJANGO_API_BASE_URL: ${DJANGO_API_BASE_URL:-http://back_django:8000}
      AUTH_MODE: ${GO_AUTH_MODE:-django_jwt}
      DJANGO_SERVICE_TOKEN: ${BM_GO_SERVICE_TOKEN:-change-me-local-service-token}
      DJANGO_TIMEOUT_SECONDS: ${DJANGO_TIMEOUT_SECONDS:-8}
      DEVICE_AUTH_CACHE_SECONDS: ${DEVICE_AUTH_CACHE_SECONDS:-10}
      PLAYER_CURSOR_SECRET: ${PLAYER_CURSOR_SECRET:-change-me-local-player-cursor-secret}
      PLAYER_MANIFEST_QUEUE_SIZE: ${PLAYER_MANIFEST_QUEUE_SIZE:-10}
      PLAYER_TELEMETRY_MAX_BYTES: ${PLAYER_TELEMETRY_MAX_BYTES:-262144}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
    ports:
      - "${GO_PORT:-8080}:${GO_PORT:-8080}"
    depends_on:
      - back_django

  front_react:
    build:
      context: ../BrandyManager_Front
    container_name: brandymanager_front
    command: bun run dev --host 0.0.0.0 --port 5173
    environment:
      VITE_DJANGO_API_URL: ${VITE_DJANGO_API_URL:-http://localhost:8000}
      VITE_GO_API_URL: ${VITE_GO_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../BrandyManager_Front:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - back_django
      - back_go

  db_admin:
    image: adminer:4
    container_name: brandymanager_db_admin
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${DB_ADMIN_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  front_node_modules:
  django_media:
