name: brandymanager

services:
  db:
    image: postgres:16-alpine
    container_name: brandymanager_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brandymanager}
      POSTGRES_USER: ${POSTGRES_USER:-brandymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandymanager}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back_django:
    build:
      context: ./back_django
    container_name: brandymanager_django
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-local-development-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-brandymanager}
      POSTGRES_USER: ${POSTGRES_USER:-brandymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandymanager}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./back_django/backend:/app
    depends_on:
      db:
        condition: service_healthy

  back_go:
    build:
      context: ./back_go
    container_name: brandymanager_go
    environment:
      PORT: ${GO_PORT:-8080}
      DJANGO_API_BASE_URL: ${DJANGO_API_BASE_URL:-http://back_django:8000}
    ports:
      - "${GO_PORT:-8080}:${GO_PORT:-8080}"
    depends_on:
      - back_django

volumes:
  postgres_data:
